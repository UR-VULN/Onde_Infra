name: "Application Deployment"
#배포시
on:
  repository_dispatch:
    types:
      - deploy-frontend
      - deploy-backend
      - deploy-admin

env:
  AWS_REGION: ap-northeast-2

jobs:
  # ──────────────────────────────────────────────
  # 프론트엔드 → WEB EC2 (Linux, Public subnet)
  # ECR: onde/frontend
  # ──────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend to WEB EC2
    if: github.event.action == 'deploy-frontend'
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy via SSM (Linux)
        env:
          IMAGE_TAG: ${{ github.event.client_payload.image_tag }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.WEB_EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters commands="[
              \"aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}\",
              \"docker pull ${{ secrets.ECR_REGISTRY }}/onde/frontend:$IMAGE_TAG\",
              \"docker stop onde-frontend || true\",
              \"docker rm onde-frontend || true\",
              \"docker run -d --name onde-frontend -p 80:80 ${{ secrets.ECR_REGISTRY }}/onde/frontend:$IMAGE_TAG\"
            ]" \
            --comment "Deploy frontend $IMAGE_TAG" \
            --query 'Command.CommandId' \
            --output text)
          echo "COMMAND_ID=$COMMAND_ID" >> $GITHUB_ENV

      - name: Wait & Verify
        run: |
          aws ssm wait command-executed \
            --command-id $COMMAND_ID \
            --instance-id "${{ secrets.WEB_EC2_INSTANCE_ID }}"

          aws ssm get-command-invocation \
            --command-id $COMMAND_ID \
            --instance-id "${{ secrets.WEB_EC2_INSTANCE_ID }}" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json

  # ──────────────────────────────────────────────
  # 백엔드 → WAS EC2 backend-1 (Linux, Private subnet)
  # ──────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend to WAS EC2
    if: github.event.action == 'deploy-backend'
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy via SSM (Linux)
        env:
          IMAGE_TAG: ${{ github.event.client_payload.image_tag }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.WAS_EC2_INSTANCE_ID_1 }}" \
            --document-name "AWS-RunShellScript" \
            --parameters commands="[
              \"aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}\",
              \"docker pull ${{ secrets.ECR_REGISTRY }}/onde/backend:$IMAGE_TAG\",
              \"docker stop onde-backend || true\",
              \"docker rm onde-backend || true\",
              \"docker run -d --name onde-backend -p 8080:8080 -e DB_URL=${{ secrets.DB_URL }} -e DB_USERNAME=${{ secrets.DB_USERNAME }} -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} -e SPRING_FLYWAY_BASELINE_ON_MIGRATE=true -e AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }} -e AWS_CLOUDFRONT_DOMAIN=${{ secrets.AWS_CLOUDFRONT_DOMAIN }} -e REDIS_HOST=${{ secrets.REDIS_HOST }} -e REDIS_PORT=${{ secrets.REDIS_PORT }} -e JWT_SECRET=${{ secrets.JWT_SECRET }} -e AWS_REGION=${{ env.AWS_REGION }} -e GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }} -e GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }} -e KAKAO_CLIENT_ID=${{ secrets.KAKAO_CLIENT_ID }} -e KAKAO_CLIENT_SECRET=${{ secrets.KAKAO_CLIENT_SECRET }} -e AES_SECRET_KEY=${{ secrets.AES_SECRET_KEY }} -e NTS_SERVICE_KEY=${{ secrets.NTS_SERVICE_KEY }} -e APP_FRONTEND_URL=https://onde.click ${{ secrets.ECR_REGISTRY }}/onde/backend:$IMAGE_TAG\"
            ]" \
            --comment "Deploy backend $IMAGE_TAG" \
            --query 'Command.CommandId' \
            --output text)
          echo "COMMAND_ID=$COMMAND_ID" >> $GITHUB_ENV

      - name: Wait & Verify
        run: |
          aws ssm wait command-executed \
            --command-id $COMMAND_ID \
            --instance-id "${{ secrets.WAS_EC2_INSTANCE_ID_1 }}"

          aws ssm get-command-invocation \
            --command-id $COMMAND_ID \
            --instance-id "${{ secrets.WAS_EC2_INSTANCE_ID_1 }}" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json

 # ──────────────────────────────────────────────
  # 어드민 → Admin EC2 (Windows, Private subnet)
  # ECR: onde/backend-admin (admin-module)
  # ──────────────────────────────────────────────
  deploy-admin:
    name: Deploy Admin to Windows EC2
    if: github.event.action == 'deploy-admin'
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy via SSM (Windows PowerShell)
        env:
          IMAGE_TAG: ${{ github.event.client_payload.image_tag }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.ADMIN_EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunPowerShellScript" \
            --parameters commands="[
              \"& 'C:\\\\Program Files\\\\Amazon\\\\AWSCLIV2\\\\aws.exe' s3 cp s3://${{ secrets.DEPLOY_BUCKET }}/admin/admin-module-$IMAGE_TAG.jar C:\\\\app\\\\admin-module.jar\",
              \"Stop-Process -Name java -Force -ErrorAction SilentlyContinue\",
              \"\$env:DB_URL='${{ secrets.DB_URL }}'; \$env:DB_USERNAME='${{ secrets.DB_USERNAME }}'; \$env:DB_PASSWORD='${{ secrets.DB_PASSWORD }}'; \$env:REDIS_HOST='${{ secrets.REDIS_HOST }}'; \$env:REDIS_PORT='${{ secrets.REDIS_PORT }}'; \$env:AWS_S3_BUCKET='${{ secrets.AWS_S3_BUCKET }}'; \$env:AWS_CLOUDFRONT_DOMAIN='${{ secrets.AWS_CLOUDFRONT_DOMAIN }}'; \$env:JWT_SECRET='${{ secrets.JWT_SECRET }}'; \$env:AWS_REGION='${{ env.AWS_REGION }}'; \$env:GOOGLE_CLIENT_ID='${{ secrets.GOOGLE_CLIENT_ID }}'; \$env:GOOGLE_CLIENT_SECRET='${{ secrets.GOOGLE_CLIENT_SECRET }}'; \$env:KAKAO_CLIENT_ID='${{ secrets.KAKAO_CLIENT_ID }}'; \$env:KAKAO_CLIENT_SECRET='${{ secrets.KAKAO_CLIENT_SECRET }}'; \$env:AES_SECRET_KEY='${{ secrets.AES_SECRET_KEY }}'; \$env:NTS_SERVICE_KEY='${{ secrets.NTS_SERVICE_KEY }}'; \$env:APP_FRONTEND_URL='https://onde.click'; \$env:HEALTH_CHECK_ALLOWED_IP='10.0.0.0/16'; \$env:SPRING_FLYWAY_BASELINE_ON_MIGRATE='true'; Start-Process 'C:\\\\Program Files\\\\Java\\\\jdk-17\\\\bin\\\\java.exe' -ArgumentList '-jar C:\\\\app\\\\admin-module.jar' -RedirectStandardOutput 'C:\\\\app\\\\stdout.log' -RedirectStandardError 'C:\\\\app\\\\stderr.log' -NoNewWindow\"
            ]" \
            --comment "Deploy admin $IMAGE_TAG" \
            --query 'Command.CommandId' \
            --output text)
          echo "COMMAND_ID=$COMMAND_ID" >> $GITHUB_ENV

      - name: Wait & Verify
        run: |
          aws ssm wait command-executed \
            --command-id $COMMAND_ID \
            --instance-id "${{ secrets.ADMIN_EC2_INSTANCE_ID }}"

          aws ssm get-command-invocation \
            --command-id $COMMAND_ID \
            --instance-id "${{ secrets.ADMIN_EC2_INSTANCE_ID }}" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json