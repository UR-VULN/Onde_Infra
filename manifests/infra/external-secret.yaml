apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-secrets
  namespace: onde-project
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secret-store
    kind: SecretStore
  target:
    name: backend-secret
  data:
  - secretKey: DB_HOST
    remoteRef:
      key: onde-project/backend
      property: DB_HOST
  - secretKey: DB_PASSWORD
    remoteRef:
      key: onde-project/backend
      property: DB_PASSWORD
  - secretKey: REDIS_HOST
    remoteRef:
      key: onde-project/backend
      property: REDIS_HOST
  # REDIS_PASSWORD is intentionally not used yet.
  # Add it after ElastiCache auth_token and transit_encryption_enabled are enabled.
